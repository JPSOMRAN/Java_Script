<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopNest</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background-color:#f4f4f4;
        }

        h1{
            color:green;
            font-size:50px;
        }

        .product{
            background:white;
            width:300px;
            margin:20px auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        button{
            background:green;
            color:white;
            border:none;
            padding:10px 20px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:darkgreen;
        }

    </style>

</head>

<body>

    <h1 id="title">ShopNest</h1>

    <p>Welcome to our Online Store</p>

    <div class="product">

        <h2>Wireless Mouse</h2>

        <p>Price: ₹799</p>

        <button id="cartBtn">
            Add To Cart
        </button>

    </div>

    <script>

        document.getElementById("cartBtn")
        .addEventListener("click",function(){

            alert("Product Added To Cart!");

            document.getElementById("title")
            .style.color="blue";

        });

    </script>

</body>
</html>
